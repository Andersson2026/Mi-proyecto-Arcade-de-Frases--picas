<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Arcade de Frases Épicas - Vota por las mejores frases de videojuegos, películas y memes." />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <title> ARCADE DE FRASES ÉPICAS | HIGH SCORES</title>
    <link rel="stylesheet" href="/src/styles/styles.css" />

    <!-- Fuentes retro Arcade -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Efecto visual de monitor CRT -->
    <div class="crt-scanlines" aria-hidden="true"></div>

    <!-- Carcasa principal de la máquina Arcade -->
    <div class="arcade-cabinet">
      <!-- Marquesina superior iluminada -->
      <header class="arcade-marquee">
        <div class="marquee-lights">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <h1> ARCADE DE FRASES ÉPICAS </h1>
        <p class="marquee-subtitle">★ VIDEOJUEGOS • PELÍCULAS • MEMES ★</p>
      </header>

      <!-- Barra de estado estilo máquina recreativa -->
      <div class="arcade-hud">
        <span class="hud-item">1UP: <strong id="total-votos">000000</strong></span>
        <span class="hud-item blink">INSERT COIN TO VOTE</span>
        <span class="hud-item">CREDITS: <strong>99</strong></span>
      </div>

      <!-- Contenedor donde TypeScript (ArcadeView) monta la app -->
      <main id="app" class="arcade-screen"></main>

      <!-- Pie de gabinete -->
      <footer class="arcade-footer">
        <span>SQLITE ENGINE v3.0 • RANKING EN TIEMPO REAL</span>
      </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
